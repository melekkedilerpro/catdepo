name: Volta Sokak Futbolu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Projeyi Hazirla
        run: |
          flutter create --platforms=android --org com.voltafutbol futbol_app
          cd futbol_app

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';

          void main() => runApp(const VoltaSoccerApp());

          class VoltaSoccerApp extends StatelessWidget {
            const VoltaSoccerApp({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Volta Futbol',
                theme: ThemeData.dark(),
                home: const MainMenuScreen(),
              );
            }
          }

          class MainMenuScreen extends StatelessWidget {
            const MainMenuScreen({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF11141C),
                body: Center(
                  child: Container(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Text('⚡ VOLTA SOKAK FUTBOLU ⚡', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.amberAccent)),
                        const SizedBox(height: 10),
                        const Text('Kafes Maçı Modunu Seçin', style: TextStyle(color: Colors.grey)),
                        const SizedBox(height: 40),
                        _modeButton(context, '2 vs 2 (Hızlı Kafes)', 2),
                        const SizedBox(height: 14),
                        _modeButton(context, '3 vs 3 (Sokak Klasik)', 3),
                        const SizedBox(height: 14),
                        _modeButton(context, '5 vs 5 (Tam Saha Volta)', 5),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _modeButton(BuildContext context, String title, int count) {
              return SizedBox(
                width: 260,
                height: 50,
                child: ElevatedButton(
                  style: ElevatedButton.styleFrom(
                    backgroundColor: Colors.amber[700],
                    foregroundColor: Colors.black,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                  ),
                  onPressed: () {
                    Navigator.push(context, MaterialPageRoute(builder: (_) => MatchScreen(teamSize: count)));
                  },
                  child: Text(title, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                ),
              );
            }
          }

          class Player {
            double x, y;
            double vx = 0, vy = 0;
            bool isTeamRed; // true: Oyuncu Takımı (Kırmızı), false: Rakip (Mavi)
            bool isControlled;
            Player(this.x, this.y, this.isTeamRed, {this.isControlled = false});
          }

          class MatchScreen extends StatefulWidget {
            final int teamSize;
            const MatchScreen({Key? key, required this.teamSize}) : super(key: key);

            @override
            State<MatchScreen> createState() => _MatchScreenState();
          }

          class _MatchScreenState extends State<MatchScreen> {
            // Saha ve Top
            double ballX = 0, ballY = 0;
            double ballVx = 0, ballVy = 0;
            int scoreRed = 0, scoreBlue = 0;
            int matchTime = 90;

            // Joystick
            Offset joystickDelta = Offset.zero;
            bool isJoystickActive = false;

            List<Player> players = [];
            Timer? loopTimer;
            Timer? matchTimer;
            String announcement = '';

            @override
            void initState() {
              super.initState();
              initMatch();
              loopTimer = Timer.periodic(const Duration(milliseconds: 25), (t) => updatePhysics());
              matchTimer = Timer.periodic(const Duration(seconds: 1), (t) {
                if (matchTime > 0) {
                  setState(() => matchTime--);
                } else {
                  t.cancel();
                  setState(() => announcement = 'MAÇ BİTTİ!');
                }
              });
            }

            @override
            void dispose() {
              loopTimer?.cancel();
              matchTimer?.cancel();
              super.dispose();
            }

            void initMatch() {
              players.clear();
              ballX = 0;
              ballY = 0;
              ballVx = 0;
              ballVy = 0;

              // Kırmızı Takım (Oyuncu)
              for (int i = 0; i < widget.teamSize; i++) {
                double py = (i - (widget.teamSize - 1) / 2) * 0.45;
                players.add(Player(-0.5, py, true, isControlled: (i == 0)));
              }

              // Mavi Takım (Rakip)
              for (int i = 0; i < widget.teamSize; i++) {
                double py = (i - (widget.teamSize - 1) / 2) * 0.45;
                players.add(Player(0.5, py, false));
              }
            }

            void updatePhysics() {
              setState(() {
                // 1. Joystick ile Kontrol Edilen Oyuncu
                for (var p in players) {
                  if (p.isControlled) {
                    p.x += joystickDelta.dx * 0.025;
                    p.y += joystickDelta.dy * 0.025;
                  } else {
                    // Yapay Zeka (Topa veya Pozisyona Koşma)
                    double targetX = p.isTeamRed ? (ballX - 0.2) : (ballX + 0.2);
                    double targetY = ballY;

                    double dx = ballX - p.x;
                    double dy = ballY - p.y;
                    double dist = sqrt(dx * dx + dy * dy);

                    if (dist > 0.05) {
                      p.x += (dx / dist) * 0.012;
                      p.y += (dy / dist) * 0.012;
                    }

                    // Rakip Şut Çekme Mantığı
                    if (!p.isTeamRed && dist < 0.08) {
                      ballVx = -0.04;
                      ballVy = (Random().nextDouble() - 0.5) * 0.03;
                    }
                  }

                  // Saha Sınırları
                  p.x = p.x.clamp(-0.9, 0.9);
                  p.y = p.y.clamp(-0.85, 0.85);

                  // Topa Çarpma (Dribling)
                  double bdx = ballX - p.x;
                  double bdy = ballY - p.y;
                  double bDist = sqrt(bdx * bdx + bdy * bdy);
                  if (bDist < 0.07) {
                    ballVx = bdx * 0.35 + (p.isControlled ? joystickDelta.dx * 0.015 : 0);
                    ballVy = bdy * 0.35 + (p.isControlled ? joystickDelta.dy * 0.015 : 0);
                  }
                }

                // 2. Top Fiziği (Sürtünme ve Duvarlar)
                ballX += ballVx;
                ballY += ballVy;
                ballVx *= 0.94; // Sürtünme
                ballVy *= 0.94;

                // Kafes Duvarlarından Sekme
                if (ballY > 0.88 || ballY < -0.88) {
                  ballVy = -ballVy * 0.8;
                  ballY = ballY.clamp(-0.88, 0.88);
                }

                // Gol Kontrolü (Sol ve Sağ Kale: Y [-0.25, 0.25])
                if (ballX > 0.92) {
                  if (ballY > -0.28 && ballY < 0.28) {
                    scoreRed++;
                    goalCelebration('⚽ GOL! KIRMIZI TAKIM');
                  } else {
                    ballVx = -ballVx * 0.8;
                    ballX = 0.92;
                  }
                } else if (ballX < -0.92) {
                  if (ballY > -0.28 && ballY < 0.28) {
                    scoreBlue++;
                    goalCelebration('⚽ GOL! MAVİ TAKIM');
                  } else {
                    ballVx = -ballVx * 0.8;
                    ballX = -0.92;
                  }
                }
              });
            }

            void goalCelebration(String msg) {
              setState(() {
                announcement = msg;
                ballVx = 0;
                ballVy = 0;
              });
              Future.delayed(const Duration(seconds: 2), () {
                if (mounted) {
                  setState(() => announcement = '');
                  initMatch();
                }
              });
            }

            void shoot() {
              Player user = players.firstWhere((p) => p.isControlled);
              double dist = sqrt(pow(ballX - user.x, 2) + pow(ballY - user.y, 2));
              if (dist < 0.12) {
                setState(() {
                  // Kaleye doğru sert şut
                  ballVx = 0.055;
                  ballVy = (user.y > 0 ? -0.01 : 0.01);
                });
              }
            }

            void pass() {
              Player user = players.firstWhere((p) => p.isControlled);
              double dist = sqrt(pow(ballX - user.x, 2) + pow(ballY - user.y, 2));
              if (dist < 0.12) {
                // En yakın takım arkadaşını bul
                Player? teammate;
                double minDist = 999;
                for (var p in players) {
                  if (p.isTeamRed && !p.isControlled) {
                    double d = sqrt(pow(p.x - user.x, 2) + pow(p.y - user.y, 2));
                    if (d < minDist) {
                      minDist = d;
                      teammate = p;
                    }
                  }
                }
                if (teammate != null) {
                  double dx = teammate.x - ballX;
                  double dy = teammate.y - ballY;
                  double d = sqrt(dx * dx + dy * dy);
                  setState(() {
                    ballVx = (dx / d) * 0.035;
                    ballVy = (dy / d) * 0.035;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF1E1E1E),
                body: SafeArea(
                  child: Stack(
                    children: [
                      // Volta Kafes Sahası
                      Positioned.fill(
                        child: CustomPaint(painter: VoltaPitchPainter()),
                      ),

                      // Skor & Süre Paneli
                      Positioned(
                        top: 10,
                        left: 20,
                        right: 20,
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Text('🔴 SEN: $scoreRed', style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.redAccent)),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                              decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(6)),
                              child: Text('⏳ ${matchTime}s', style: const TextStyle(fontWeight: FontWeight.bold)),
                            ),
                            Text('MAVİ: $scoreBlue 🔵', style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.blueAccent)),
                          ],
                        ),
                      ),

                      // Gol Duyurusu
                      if (announcement.isNotEmpty)
                        Center(
                          child: Container(
                            padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 10),
                            color: Colors.black87,
                            child: Text(announcement, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.amberAccent)),
                          ),
                        ),

                      // Oyuncular (İnsan Görünümlü 2D Karakterler)
                      ...players.map((p) => Align(
                        alignment: Alignment(p.x, p.y),
                        child: Container(
                          width: 22,
                          height: 22,
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            color: p.isTeamRed ? Colors.red : Colors.blue,
                            border: Border.all(color: p.isControlled ? Colors.yellowAccent : Colors.white, width: p.isControlled ? 3 : 1.5),
                            boxShadow: [BoxShadow(color: Colors.black45, blurRadius: 4, offset: const Offset(1, 2))],
                          ),
                          child: Center(
                            child: Container(
                              width: 8,
                              height: 8,
                              decoration: const BoxDecoration(shape: BoxShape.circle, color: Color(0xFFFFCC80)), // Ten rengi kafa
                            ),
                          ),
                        ),
                      )),

                      // Futbol Topu
                      Align(
                        alignment: Alignment(ballX, ballY),
                        child: Container(
                          width: 14,
                          height: 14,
                          decoration: const BoxDecoration(
                            shape: BoxShape.circle,
                            color: Colors.white,
                            boxShadow: [BoxShadow(color: Colors.black87, blurRadius: 3)],
                          ),
                        ),
                      ),

                      // Kontroller: Sol Taraf Sanal Joystick
                      Positioned(
                        bottom: 30,
                        left: 30,
                        child: GestureDetector(
                          onPanStart: (d) => setState(() => isJoystickActive = true),
                          onPanUpdate: (d) {
                            setState(() {
                              joystickDelta = Offset(
                                (d.localPosition.dx - 45).clamp(-45.0, 45.0) / 45.0,
                                (d.localPosition.dy - 45).clamp(-45.0, 45.0) / 45.0,
                              );
                            });
                          },
                          onPanEnd: (d) {
                            setState(() {
                              joystickDelta = Offset.zero;
                              isJoystickActive = false;
                            });
                          },
                          child: Container(
                            width: 90,
                            height: 90,
                            decoration: BoxDecoration(
                              shape: BoxShape.circle,
                              color: Colors.white12,
                              border: Border.all(color: Colors.white30, width: 2),
                            ),
                            child: Center(
                              child: Transform.translate(
                                offset: joystickDelta * 25,
                                child: Container(
                                  width: 38,
                                  height: 38,
                                  decoration: const BoxDecoration(shape: BoxShape.circle, color: Colors.amberAccent),
                                ),
                              ),
                            ),
                          ),
                        ),
                      ),

                      // Kontroller: Sağ Taraf ŞUT & PAS Butonları
                      Positioned(
                        bottom: 30,
                        right: 30,
                        child: Row(
                          children: [
                            GestureDetector(
                              onTap: pass,
                              child: Container(
                                width: 55,
                                height: 55,
                                decoration: const BoxDecoration(shape: BoxShape.circle, color: Colors.blueAccent),
                                child: const Center(child: Text('PAS', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 13))),
                              ),
                            ),
                            const SizedBox(width: 16),
                            GestureDetector(
                              onTap: shoot,
                              child: Container(
                                width: 65,
                                height: 65,
                                decoration: const BoxDecoration(shape: BoxShape.circle, color: Colors.redAccent),
                                child: const Center(child: Text('ŞUT', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15))),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class VoltaPitchPainter extends CustomPainter {
            @override
            void paint(Canvas canvas, Size size) {
              final p = Paint()..color = const Color(0xFF23382B); // Kafes zemin
              canvas.drawRect(Rect.fromLTWH(0, 0, size.width, size.height), p);

              final linePaint = Paint()
                ..color = Colors.white24
                ..strokeWidth = 2
                ..style = PaintingStyle.stroke;

              // Saha Çizgileri
              canvas.drawRect(Rect.fromLTWH(15, 30, size.width - 30, size.height - 60), linePaint);
              canvas.drawLine(Offset(size.width / 2, 30), Offset(size.width / 2, size.height - 30), linePaint);
              canvas.drawCircle(Offset(size.width / 2, size.height / 2), 45, linePaint);

              // Kaleler
              final goalPaint = Paint()..color = Colors.amber.withOpacity(0.5)..style = PaintingStyle.stroke..strokeWidth = 3;
              canvas.drawRect(Rect.fromLTWH(2, (size.height / 2) - 40, 13, 80), goalPaint); // Sol Kale
              canvas.drawRect(Rect.fromLTWH(size.width - 15, (size.height / 2) - 40, 13, 80), goalPaint); // Sağ Kale
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
          }
          EOF

      - name: APK Derle
        run: |
          cd futbol_app
          flutter build apk --release

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: VoltaFutbolOyunu
          path: futbol_app/build/app/outputs/flutter-apk/app-release.apk
