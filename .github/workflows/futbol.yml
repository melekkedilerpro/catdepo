name: Futbol Menajeri APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Projeyi Hazirla
        run: |
          flutter create --platforms=android --org com.futbolmenajeri menajer_app
          cd menajer_app

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';

          void main() => runApp(const MenajerApp());

          class MenajerApp extends StatelessWidget {
            const MenajerApp({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Süper Lig 20 Takım Menajer',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF10141E),
                  primaryColor: Colors.amber,
                ),
                home: const AnaPanel(),
              );
            }
          }

          class Team {
            String name;
            int attack;
            int defense;
            int points = 0;
            int played = 0;
            int won = 0;
            int drawn = 0;
            int lost = 0;
            int gf = 0;
            int ga = 0;
            Team(this.name, this.attack, this.defense);
            int get gd => gf - ga;
          }

          class Player {
            String name;
            String pos;
            int overall;
            int price;
            Player(this.name, this.pos, this.overall, this.price);
          }

          class AnaPanel extends StatefulWidget {
            const AnaPanel({Key? key}) : super(key: key);

            @override
            State<AnaPanel> createState() => _AnaPanelState();
          }

          class _AnaPanelState extends State<AnaPanel> {
            int budget = 25000000;
            int week = 1;
            String currentTactic = 'Dengeli (4-3-3)';
            int tacticBonus = 0;

            List<Player> mySquad = [
              Player('Muslera', 'KL', 84, 0),
              Player('Nelsson', 'DF', 81, 0),
              Player('Sanchez', 'DF', 83, 0),
              Player('Barış Alper', 'DF', 80, 0),
              Player('Torreira', 'OS', 85, 0),
              Player('Gabriel Sara', 'OS', 82, 0),
              Player('Mertens', 'OS', 81, 0),
              Player('Kerem', 'HF', 82, 0),
              Player('Zaha', 'HF', 83, 0),
              Player('Icardi', 'FV', 88, 0),
              Player('Osimhen', 'FV', 89, 0),
            ];

            List<Player> transferMarket = [
              Player('K. De Bruyne', 'OS', 91, 35000000),
              Player('V. van Dijk', 'DF', 89, 30000000),
              Player('E. Haaland', 'FV', 93, 50000000),
              Player('T. Courtois', 'KL', 90, 28000000),
              Player('H. Kane', 'FV', 90, 32000000),
              Player('F. de Jong', 'OS', 87, 22000000),
              Player('J. Bellingham', 'OS', 90, 45000000),
              Player('R. Leao', 'HF', 88, 28000000),
              Player('A. Hakimi', 'DF', 86, 20000000),
              Player('L. Martinez', 'FV', 88, 27000000),
            ];

            // 20 Takımlı Tam Süper Lig Listesi
            List<Team> leagueTeams = [
              Team('Galatasaray', 85, 83),
              Team('Fenerbahçe', 84, 82),
              Team('Beşiktaş', 82, 80),
              Team('Trabzonspor', 79, 78),
              Team('Başakşehir', 77, 76),
              Team('Samsunspor', 75, 74),
              Team('Eyüpspor', 74, 73),
              Team('Kasımpaşa', 74, 72),
              Team('Göztepe', 73, 73),
              Team('Sivasspor', 73, 72),
              Team('Antalyaspor', 72, 72),
              Team('Gaziantep FK', 72, 71),
              Team('Alanyaspor', 72, 71),
              Team('Çaykur Rizespor', 71, 71),
              Team('Kayserispor', 71, 70),
              Team('Konyaspor', 70, 70),
              Team('Bodrum FK', 69, 69),
              Team('Hatayspor', 69, 68),
              Team('Adana Demirspor', 68, 67),
              Team('Ankaragücü', 68, 67),
            ];

            int get teamPower {
              if (mySquad.isEmpty) return 0;
              int sum = 0;
              for (var p in mySquad) {
                sum += p.overall;
              }
              return (sum / mySquad.length).round() + tacticBonus;
            }

            void changeTactic(String val) {
              setState(() {
                currentTactic = val;
                if (val.contains('Hücum')) tacticBonus = 3;
                else if (val.contains('Savunma')) tacticBonus = 1;
                else tacticBonus = 2;
              });
            }

            void buyPlayer(Player p) {
              if (budget >= p.price) {
                setState(() {
                  budget -= p.price;
                  transferMarket.remove(p);
                  mySquad.add(p);
                });
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('${p.name} transfer edildi!')));
              } else {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Bütçe yetersiz!')));
              }
            }

            void startNextMatch() {
              if (week > 38) {
                showDialog(
                  context: context,
                  builder: (_) => AlertDialog(
                    title: const Text('🏆 38 HAFTALIK SEZON BİTTİ!'),
                    content: Text('Tebrikler! 20 takımlı lig maratonu tamamlandı.\nŞampiyon: ${leagueTeams[0].name} (${leagueTeams[0].points} Puan)'),
                    actions: [TextButton(onPressed: () => Navigator.pop(context), child: const Text('Tamam'))],
                  ),
                );
                return;
              }

              // 20 takımlı lig için sıradaki rakip (1'den 19'a kadar döngü)
              int opponentIndex = ((week - 1) % 19) + 1;
              final opponent = leagueTeams[opponentIndex];

              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => LiveMatchScreen(
                    myTeamName: 'Galatasaray',
                    myPower: teamPower,
                    oppTeamName: opponent.name,
                    oppPower: (opponent.attack + opponent.defense) ~/ 2,
                    onMatchEnd: (myGoals, oppGoals) {
                      setState(() {
                        week++;
                        var myTeam = leagueTeams.firstWhere((t) => t.name == 'Galatasaray');
                        myTeam.played++;
                        myTeam.gf += myGoals;
                        myTeam.ga += oppGoals;
                        opponent.played++;
                        opponent.gf += oppGoals;
                        opponent.ga += myGoals;

                        if (myGoals > oppGoals) {
                          myTeam.won++;
                          myTeam.points += 3;
                          opponent.lost++;
                          budget += 3000000;
                        } else if (myGoals == oppGoals) {
                          myTeam.drawn++;
                          myTeam.points += 1;
                          opponent.drawn++;
                          opponent.points += 1;
                          budget += 1200000;
                        } else {
                          myTeam.lost++;
                          opponent.won++;
                          opponent.points += 3;
                        }

                        // Ligdeki diğer 18 takımın maç simülasyonu
                        List<Team> otherTeams = leagueTeams.where((t) => t.name != 'Galatasaray' && t.name != opponent.name).toList();
                        for (int i = 0; i < otherTeams.length; i += 2) {
                          if (i + 1 < otherTeams.length) {
                            var t1 = otherTeams[i];
                            var t2 = otherTeams[i + 1];
                            int g1 = Random().nextInt(4);
                            int g2 = Random().nextInt(4);
                            t1.played++;
                            t1.gf += g1;
                            t1.ga += g2;
                            t2.played++;
                            t2.gf += g2;
                            t2.ga += g1;

                            if (g1 > g2) {
                              t1.won++;
                              t1.points += 3;
                              t2.lost++;
                            } else if (g1 == g2) {
                              t1.drawn++;
                              t1.points += 1;
                              t2.drawn++;
                              t2.points += 1;
                            } else {
                              t2.won++;
                              t2.points += 3;
                              t1.lost++;
                            }
                          }
                        }

                        leagueTeams.sort((a, b) {
                          if (b.points != a.points) return b.points.compareTo(a.points);
                          return b.gd.compareTo(a.gd);
                        });
                      });
                    },
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('⚽ SÜPER LİG MENAJER 2026', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                  backgroundColor: const Color(0xFF1A2234),
                  actions: [
                    Center(
                      child: Padding(
                        padding: const EdgeInsets.only(right: 16),
                        child: Text('💰 €${(budget / 1000000).toStringAsFixed(1)}M', style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold, fontSize: 15)),
                      ),
                    ),
                  ],
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(14),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          gradient: const LinearGradient(colors: [Color(0xFF1E293B), Color(0xFF0F172A)]),
                          borderRadius: BorderRadius.circular(12),
                          border: Border.all(color: Colors.amber.withOpacity(0.4)),
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('Takım: Galatasaray', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.amberAccent)),
                                const SizedBox(height: 4),
                                Text('Hafta: $week / 38 | Güç: $teamPower', style: const TextStyle(color: Colors.grey)),
                              ],
                            ),
                            ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(backgroundColor: Colors.green[600], foregroundColor: Colors.white),
                              onPressed: startNextMatch,
                              icon: const Icon(Icons.play_arrow),
                              label: const Text('MAÇA ÇIK'),
                            ),
                          ],
                        ),
                      ),

                      const SizedBox(height: 18),
                      const Text('📋 Taktik & Diziliş', style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 6),
                      DropdownButtonFormField<String>(
                        value: currentTactic,
                        decoration: InputDecoration(
                          filled: true,
                          fillColor: const Color(0xFF1E293B),
                          contentPadding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(10)),
                        ),
                        items: ['Hücum (4-3-3)', 'Dengeli (4-3-3)', 'Kontra Atak (4-4-2)', 'Katı Savunma (5-3-2)']
                            .map((t) => DropdownMenuItem(value: t, child: Text(t))).toList(),
                        onChanged: (v) => changeTactic(v!),
                      ),

                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          const Text('🏆 Süper Lig Puan Tablosu (20 Takım)', style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold)),
                          Text('Hafta $week', style: const TextStyle(color: Colors.amberAccent, fontSize: 12)),
                        ],
                      ),
                      const SizedBox(height: 8),
                      Container(
                        width: double.infinity,
                        decoration: BoxDecoration(color: const Color(0xFF1E293B), borderRadius: BorderRadius.circular(10)),
                        child: SingleChildScrollView(
                          scrollDirection: Axis.horizontal,
                          child: DataTable(
                            columnSpacing: 14,
                            headingRowHeight: 36,
                            dataRowMinHeight: 32,
                            dataRowMaxHeight: 38,
                            columns: const [
                              DataColumn(label: Text('Sıra')),
                              DataColumn(label: Text('Takım')),
                              DataColumn(label: Text('O')),
                              DataColumn(label: Text('G')),
                              DataColumn(label: Text('B')),
                              DataColumn(label: Text('M')),
                              DataColumn(label: Text('Av')),
                              DataColumn(label: Text('P')),
                            ],
                            rows: List.generate(leagueTeams.length, (index) {
                              final t = leagueTeams[index];
                              final isMyTeam = t.name == 'Galatasaray';
                              return DataRow(
                                color: WidgetStateProperty.resolveWith((_) => isMyTeam ? Colors.amber.withOpacity(0.15) : null),
                                cells: [
                                  DataCell(Text('${index + 1}', style: TextStyle(fontWeight: FontWeight.bold, color: index < 4 ? Colors.greenAccent : (index >= 16 ? Colors.redAccent : Colors.white)))),
                                  DataCell(Text(t.name, style: TextStyle(fontWeight: isMyTeam ? FontWeight.bold : FontWeight.normal, color: isMyTeam ? Colors.amberAccent : Colors.white))),
                                  DataCell(Text('${t.played}')),
                                  DataCell(Text('${t.won}')),
                                  DataCell(Text('${t.drawn}')),
                                  DataCell(Text('${t.lost}')),
                                  DataCell(Text('${t.gd}')),
                                  DataCell(Text('${t.points}', style: const TextStyle(fontWeight: FontWeight.bold))),
                                ],
                              );
                            }),
                          ),
                        ),
                      ),

                      const SizedBox(height: 20),
                      const Text('⭐ Transfer Pazarı', style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.greenAccent)),
                      const SizedBox(height: 8),
                      ListView.builder(
                        shrinkWrap: true,
                        physics: const NeverScrollableScrollPhysics(),
                        itemCount: transferMarket.length,
                        itemBuilder: (context, i) {
                          final p = transferMarket[i];
                          return Card(
                            color: const Color(0xFF1A233A),
                            margin: const EdgeInsets.only(bottom: 6),
                            child: ListTile(
                              leading: CircleAvatar(backgroundColor: Colors.amber, radius: 18, child: Text(p.pos, style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 12))),
                              title: Text(p.name, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
                              subtitle: Text('Güç: ${p.overall} | Fiyat: €${(p.price / 1000000).toStringAsFixed(0)}M', style: const TextStyle(fontSize: 12)),
                              trailing: ElevatedButton(
                                style: ElevatedButton.styleFrom(backgroundColor: Colors.green, padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6)),
                                onPressed: () => buyPlayer(p),
                                child: const Text('Satın Al', style: TextStyle(fontSize: 12)),
                              ),
                            ),
                          );
                        },
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class LiveMatchScreen extends StatefulWidget {
            final String myTeamName;
            final int myPower;
            final String oppTeamName;
            final int oppPower;
            final Function(int myGoals, int oppGoals) onMatchEnd;

            const LiveMatchScreen({
              Key? key,
              required this.myTeamName,
              required this.myPower,
              required this.oppTeamName,
              required this.oppPower,
              required this.onMatchEnd,
            }) : super(key: key);

            @override
            State<LiveMatchScreen> createState() => _LiveMatchScreenState();
          }

          class _LiveMatchScreenState extends State<LiveMatchScreen> {
            int minute = 0;
            int scoreA = 0;
            int scoreB = 0;
            List<String> matchEvents = [];
            Timer? matchTimer;
            bool isFinished = false;

            @override
            void initState() {
              super.initState();
              matchEvents.add('Hakem düdüğünü çaldı ve maç başladı!');
              matchTimer = Timer.periodic(const Duration(milliseconds: 90), (t) {
                if (minute < 90) {
                  setState(() {
                    minute += 2;
                    simulateMinute(minute);
                  });
                } else {
                  t.cancel();
                  setState(() {
                    isFinished = true;
                    matchEvents.insert(0, '⏱️ MAÇ SONUCU: ${widget.myTeamName} $scoreA - $scoreB ${widget.oppTeamName}');
                  });
                }
              });
            }

            void simulateMinute(int min) {
              final rnd = Random();
              double myChance = (widget.myPower / (widget.myPower + widget.oppPower)) * 0.08;
              double oppChance = (widget.oppPower / (widget.myPower + widget.oppPower)) * 0.08;

              if (rnd.nextDouble() < myChance) {
                scoreA++;
                matchEvents.insert(0, '⚽ $min\' GOOOOL! ${widget.myTeamName} golü buldu!');
              } else if (rnd.nextDouble() < oppChance) {
                scoreB++;
                matchEvents.insert(0, '⚽ $min\' GOL! ${widget.oppTeamName} skoru değiştirdi.');
              } else if (rnd.nextDouble() < 0.03) {
                matchEvents.insert(0, '🟨 $min\' Hakem sarı kartını gösterdi.');
              } else if (rnd.nextDouble() < 0.04) {
                matchEvents.insert(0, '🧤 $min\' Kaleciden kritik kurtarış!');
              }
            }

            @override
            void dispose() {
              matchTimer?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0D111A),
                appBar: AppBar(title: const Text('CANLI MAÇ ANLATIMI'), backgroundColor: const Color(0xFF1E293B)),
                body: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(color: const Color(0xFF1E293B), borderRadius: BorderRadius.circular(16)),
                        child: Column(
                          children: [
                            Text('⏱️ Dakika: $minute\'', style: const TextStyle(color: Colors.amberAccent, fontSize: 16, fontWeight: FontWeight.bold)),
                            const SizedBox(height: 12),
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceAround,
                              children: [
                                Expanded(child: Text(widget.myTeamName, textAlign: TextAlign.center, style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.amber))),
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                                  decoration: BoxDecoration(color: Colors.black45, borderRadius: BorderRadius.circular(8)),
                                  child: Text('$scoreA - $scoreB', style: const TextStyle(fontSize: 26, fontWeight: FontWeight.bold)),
                                ),
                                Expanded(child: Text(widget.oppTeamName, textAlign: TextAlign.center, style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.blueAccent))),
                              ],
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 16),
                      const Align(alignment: Alignment.centerLeft, child: Text('Maç Olayları:', style: TextStyle(fontWeight: FontWeight.bold))),
                      const SizedBox(height: 8),
                      Expanded(
                        child: Container(
                          padding: const EdgeInsets.all(10),
                          decoration: BoxDecoration(color: const Color(0xFF141A26), borderRadius: BorderRadius.circular(10)),
                          child: ListView.builder(
                            itemCount: matchEvents.length,
                            itemBuilder: (context, i) => Padding(
                              padding: const EdgeInsets.symmetric(vertical: 4),
                              child: Text(matchEvents[i], style: TextStyle(color: matchEvents[i].contains('GOOOOL') ? Colors.greenAccent : Colors.white70)),
                            ),
                          ),
                        ),
                      ),
                      if (isFinished)
                        Padding(
                          padding: const EdgeInsets.only(top: 14),
                          child: SizedBox(
                            width: double.infinity,
                            height: 50,
                            child: ElevatedButton(
                              style: ElevatedButton.styleFrom(backgroundColor: Colors.amber[700], foregroundColor: Colors.black),
                              onPressed: () {
                                widget.onMatchEnd(scoreA, scoreB);
                                Navigator.pop(context);
                              },
                              child: const Text('MAÇI TAMAMLA & DEVAM ET', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                            ),
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: APK Derle
        run: |
          cd menajer_app
          flutter build apk --release

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: SuperLig20TakimMenajer
          path: menajer_app/build/app/outputs/flutter-apk/app-release.apk
